<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Meu QG</title>
<meta name="description" content="Seu painel pessoal: finanças, demandas, agenda, rotina, saúde, estudos e conteúdo.">
<meta name="theme-color" content="#3d7bfd">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="painel-192.png">
<link rel="apple-touch-icon" href="painel-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Meu QG">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}*,*::before,*::after{box-sizing:inherit}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..900&family=Questrial&display=swap">
<style>
/* Layout: trilho lateral fixo (desktop) / barra inferior (celular) + área de trabalho com cabeçalho editorial editorial */
/* Tema: claro por padrão (cartões brancos sobre fundo quente), escuro pelo botão sol/lua — data-skin no <html> */
:root{
  --bg:#f3f1ed; --bg-2:#e9e6e0; --surface:#ffffff; --surface-2:#f5f3ef; --line:#e6e1d9; --fg:#161514; --muted:#6e685f;
  --accent:#3d7bfd; --accent-2:#7aa3fe; --accent-ink:#141414; --accent-soft:color-mix(in srgb,var(--accent) 11%,transparent);
  --ok:#1f9a62; --warn:#c08310; --bad:#d4443a; --info:#2f80c9;
  --shadow:0 1px 2px rgba(30,24,16,.05),0 10px 28px -12px rgba(30,24,16,.14);
  --shadow-up:0 2px 4px rgba(30,24,16,.06),0 18px 36px -14px rgba(30,24,16,.24);
  --hot-bg:linear-gradient(140deg,#1a1918 0%,#2e2b28 100%); --hot-fg:#ffffff; --hot-acc:var(--accent-2);
  --rail:#ffffff;
  --font-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --font-body:"Archivo","Helvetica Neue",Arial,sans-serif;
  --font-brand:"Questrial","Archivo",sans-serif;
  --r:14px; color-scheme:light;
}
:root[data-skin="escuro"]{
  --bg:#111110; --bg-2:#181716; --surface:#1b1a19; --surface-2:#242220; --line:#2f2c29; --fg:#f4f1ec; --muted:#9e978e;
  --accent:#3d7bfd; --accent-2:#7aa3fe; --accent-ink:#141414; --accent-soft:color-mix(in srgb,var(--accent) 15%,transparent);
  --ok:#43b581; --warn:#f0b43c; --bad:#ec5a4f; --info:#5aa7e8;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 28px -14px rgba(0,0,0,.6);
  --shadow-up:0 2px 4px rgba(0,0,0,.4),0 20px 40px -14px rgba(0,0,0,.75);
  --hot-bg:linear-gradient(140deg,var(--accent) 0%,var(--accent-2) 100%); --hot-fg:var(--accent-ink); --hot-acc:var(--accent-ink);
  --rail:#161514; color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body);font-variation-settings:"wdth" 100;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
.rail{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);padding:28px 18px 18px;display:flex;flex-direction:column;gap:28px;background:var(--bg)}
.mark{font-family:var(--font-display);font-weight:800;font-size:19px;letter-spacing:-.04em;line-height:1}
.mark b{color:var(--accent)}
.mark small{display:block;font:11px var(--font-brand);letter-spacing:.02em;color:var(--muted);margin-top:6px;font-weight:400}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:600;font-size:14px}
.nav a svg{width:18px;height:18px;flex:none}
.nav a:hover{color:var(--fg);background:var(--surface)}
.nav a[aria-current="page"]{color:var(--fg);background:var(--surface)}
.nav a[aria-current="page"] svg{color:var(--accent)}
.rail-foot{margin-top:auto;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:8px}
.sync{display:flex;align-items:center;gap:8px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync[data-s="ok"] i{background:var(--ok)} .sync[data-s="local"] i{background:var(--warn)} .sync[data-s="err"] i{background:var(--bad)}
main{min-width:0;padding-block:32px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:24px}

/* ---------- editorial header ---------- */
.hd{display:flex;flex-direction:column;gap:10px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.eyebrow em{font-style:normal;color:var(--accent)}
.h1{font-family:var(--font-display);font-weight:850;font-variation-settings:"wdth" 92;font-size:clamp(34px,5.4vw,60px);line-height:.92;letter-spacing:-.045em;text-transform:uppercase;margin:0;text-wrap:balance}
.h1 .tag{display:inline-block;background:var(--accent);color:var(--accent-ink);padding:0 .18em;transform:rotate(-2deg);margin-left:.06em}
.hd-row{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px}
.sub{color:var(--muted);font-family:var(--font-brand);font-size:15px}
.h2{font-family:var(--font-display);font-weight:800;font-size:15px;letter-spacing:.06em;text-transform:uppercase;margin:0}

/* ---------- primitives ---------- */
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;padding:10px 14px;font-weight:700;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);border-color:var(--accent)}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:999px;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 11px;font-size:12px}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:default}
.icon-btn{border:1px solid var(--line);background:var(--surface);width:30px;height:30px;border-radius:8px;display:inline-grid;place-items:center;cursor:pointer;color:var(--muted)}
.icon-btn:hover{color:var(--fg)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.panel-hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi{background:var(--surface);padding:16px 18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi .l{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-family:var(--font-display);font-weight:800;font-size:26px;letter-spacing:-.03em;line-height:1.05;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi .d{font-size:12.5px;color:var(--muted)}
.kpi.hot{background:var(--accent);color:var(--accent-ink)} .kpi.hot .l,.kpi.hot .d{color:var(--accent-ink);opacity:.75}
.up{color:var(--ok)} .down{color:var(--bad)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--fg);white-space:nowrap}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--c,var(--muted))}
.badge{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:6px;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.badge.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.badge.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.badge.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.badge.acc{background:var(--accent-soft);color:var(--accent)}
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.filters button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.filters button i{width:7px;height:7px;border-radius:50%;background:var(--c,var(--muted))}
.filters button[aria-pressed="true"]{color:var(--fg);border-color:var(--fg)}
.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar>span{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.ok>span{background:var(--ok)} .bar.bad>span{background:var(--bad)}
.muted{color:var(--muted)} .small{font-size:12.5px}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;color:var(--muted);font-size:13.5px}
.note{font-size:12.5px;color:var(--muted);border-left:2px solid var(--accent);padding:2px 0 2px 10px}
.ex{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:0 4px;margin-left:6px;vertical-align:1px}

/* tables */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl td.r,.tbl th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tr.click{cursor:pointer} .tbl tr.click:hover td{background:var(--surface-2)}
.tbl tr.off td{opacity:.45}
.tbl tfoot td{font-weight:800;border-top:1px solid var(--line)}

/* list rows */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);min-width:0}
.row:last-child{border-bottom:0}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .t span{font-size:12.5px;color:var(--muted)}
.date-box{width:44px;flex:none;text-align:center;border:1px solid var(--line);border-radius:8px;padding:4px 0;line-height:1.1}
.date-box b{display:block;font-family:var(--font-display);font-size:17px;font-weight:800}
.date-box span{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}

/* board */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(260px,1fr);gap:14px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px;min-height:120px}
.col-hd{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.col-hd span{color:var(--muted)}
.card{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:11px 12px;display:flex;flex-direction:column;gap:8px;cursor:pointer;border-left:3px solid var(--c,var(--line))}
.card:hover{border-color:var(--muted);border-left-color:var(--c,var(--muted))}
.card b{font-weight:650;font-size:14px;line-height:1.3}
.card .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.card .mv{display:flex;gap:4px;margin-left:auto}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dow{font-size:10.5px;font-weight:800;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;padding:4px}
.cal .day{min-height:86px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px;display:flex;flex-direction:column;gap:3px;min-width:0}
.cal .day.out{opacity:.35}
.cal .day.today{border-color:var(--accent)}
.cal .day .n{font-size:11.5px;font-weight:800;color:var(--muted)}
.cal .ev{font-size:11px;font-weight:650;padding:2px 5px;border-radius:4px;background:var(--surface-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;border-left:2px solid var(--c,var(--accent))}

/* forms */
dialog{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:14px;padding:0;width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 48px)}
dialog::backdrop{background:rgba(0,0,0,.55)}
.dlg{display:flex;flex-direction:column;max-height:calc(100vh - 50px)}
.dlg-hd{padding:18px 20px 10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.dlg-bd{padding:6px 20px 16px;overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dlg-ft{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.dlg-ft .sp{margin-right:auto}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f.full{grid-column:1/-1}
.f label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.inp,.f input,.f select,.f textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:14px}
.f textarea{min-height:84px;resize:vertical}
.f input[type=checkbox]{width:auto}
.check{display:flex;align-items:center;gap:8px;font-size:14px}
.sim-in{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
input[type=range]{accent-color:var(--accent);width:100%}
.big{font-family:var(--font-display);font-weight:850;font-size:clamp(28px,4vw,40px);letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.chart-box{position:relative;height:240px}
.chart-box.tall{height:300px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;font-size:13px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.drop{border:1.5px dashed var(--line);border-radius:var(--r);padding:28px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wd{border:1px solid var(--line);border-radius:8px;padding:8px;min-width:0;cursor:pointer;display:flex;flex-direction:column;gap:4px;background:var(--bg)}
.wd.now{border-color:var(--accent)}
.wd b{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.wd span{font-size:12.5px;font-weight:650;overflow-wrap:anywhere}
.wd.done{background:var(--accent-soft)}
.water{display:flex;gap:4px;flex-wrap:wrap}
.water i{width:18px;height:26px;border-radius:4px 4px 6px 6px;border:1.5px solid var(--info);display:block}
.water i.f{background:var(--info)}
.ai-out{white-space:pre-wrap;font-size:14px}
.split{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.stack{display:flex;flex-direction:column;gap:12px}
.hstack{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

@media (max-width:980px){
  .g-main,.g3{grid-template-columns:1fr}
}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .rail{position:fixed;inset:auto 0 0 0;height:auto;top:auto;flex-direction:row;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));border-right:0;border-top:1px solid var(--line);z-index:20;gap:0}
  .rail .mark,.rail-foot{display:none}
  .nav{flex-direction:row;justify-content:flex-start;width:100%;overflow-x:auto;scrollbar-width:none}
  .nav a{flex-direction:column;gap:3px;font-size:10px;padding:6px 4px;flex:1 0 58px;align-items:center}
  .ag-week{grid-template-columns:none!important;grid-auto-flow:column;grid-auto-columns:76%;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:6px}.ag-day{scroll-snap-align:start}
  .mail-wrap{grid-template-columns:1fr!important}
  .nav a span{white-space:nowrap}
  main{padding-block:20px 110px}
  .g2{grid-template-columns:1fr}
  .dlg-bd{grid-template-columns:1fr}
  .cal .day{min-height:58px}
  .cal .ev{font-size:0;height:6px;padding:0}
  .mob-mark{display:block!important}
}
.mob-mark{display:none}
.ag-week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.ag-day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0;min-height:140px}
.ag-day.today{border-color:var(--accent)}
.ag-day h3{margin:0;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:baseline}
.ag-day h3 b{font-family:var(--font-display);font-size:20px;color:var(--fg);letter-spacing:-.02em}
.ev2{border-left:3px solid var(--c,var(--accent));background:var(--bg);border-radius:6px;padding:6px 8px;cursor:pointer;display:flex;flex-direction:column;gap:1px;min-width:0}
.ev2:hover{background:var(--surface-2)}
.ev2 small{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.ev2 span{font-size:12.5px;font-weight:650;overflow-wrap:anywhere}
.ev2.qg{border-left-style:dashed;background:transparent;border:1px dashed var(--line);border-left:3px dashed var(--c)}
.mail-wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:16px;align-items:start}
.mail{display:flex;gap:10px;padding:11px 12px;border-bottom:1px solid var(--line);cursor:pointer;min-width:0}
.mail:hover,.mail.sel{background:var(--surface-2)}
.mail .t{flex:1;min-width:0}
.mail .t b,.mail .t span,.mail .t em{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mail .t b{font-weight:600;font-size:13.5px}
.mail.unread .t b{font-weight:800}
.mail .t span{font-size:13.5px}
.mail.unread .t span{font-weight:700}
.mail .t em{font-style:normal;font-size:12.5px;color:var(--muted)}
.mail .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:6px;flex:none}
.mail .dot.off{background:transparent}
.mail time{font-size:11.5px;color:var(--muted);white-space:nowrap}
.msg{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.msg pre{white-space:pre-wrap;font:14px/1.55 var(--font-body);margin:0;max-height:420px;overflow:auto;overflow-wrap:anywhere}
.reader{position:sticky;top:16px}

/* =========================================================
   Camada visual 2: cartões, ícones, movimento
   ========================================================= */
body{background:radial-gradient(1200px 600px at 85% -10%,var(--accent-soft),transparent 60%),linear-gradient(180deg,var(--bg),var(--bg-2));background-attachment:fixed}
#bgfx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.app{position:relative;z-index:1}
.ico{width:1em;height:1em;flex:none;display:inline-block;vertical-align:-.14em}
.panel{border-radius:var(--r);box-shadow:var(--shadow);border-color:transparent}
:root[data-skin="escuro"] .panel{border-color:var(--line)}
.panel-hd .h2,.panel>.h2{display:inline-flex;align-items:center;gap:9px}
.h2-ic{width:28px;height:28px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:inline-grid;place-items:center;flex:none}
.h2-ic svg{width:15px;height:15px}
.kpis{gap:12px;background:none;border:0;overflow:visible;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.kpi{border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px 18px;position:relative;transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s}
:root[data-skin="escuro"] .kpi{border:1px solid var(--line)}
.kpi:hover{transform:translateY(-3px);box-shadow:var(--shadow-up)}
.kpi-ic{width:34px;height:34px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin-bottom:6px}
.kpi-ic svg{width:17px;height:17px}
.kpi .v{font-size:clamp(19px,1.85vw,27px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi.hot{background:var(--hot-bg);color:var(--hot-fg);overflow:hidden}
.kpi.hot .l,.kpi.hot .d{color:var(--hot-fg);opacity:.72}
.kpi.hot .kpi-ic{background:rgba(255,255,255,.12);color:var(--hot-acc)}
.kpi.hot::after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,var(--hot-acc),transparent 70%);opacity:.28;animation:pulse 4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.25);opacity:.14}}
@media (min-width:761px){
  .app{grid-template-columns:250px 1fr}
  .rail{top:14px;height:calc(100vh - 28px);margin:14px 0 14px 14px;border:0;border-radius:20px;background:var(--rail);box-shadow:var(--shadow);padding:24px 14px 16px}
  :root[data-skin="escuro"] .rail{border:1px solid var(--line)}
}
.nav a{border-radius:11px;transition:background .2s,color .2s,transform .2s;position:relative}
.nav a:hover{transform:translateX(3px);background:var(--surface-2)}

.nav a[aria-current="page"] svg{color:var(--accent)}
@media (max-width:760px){.rail{background:var(--rail);box-shadow:0 -6px 24px -12px rgba(0,0,0,.25)}.nav a:hover{transform:none}.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--fg)}}
.btn{position:relative;overflow:hidden;transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .2s,border-color .2s,background .2s;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.btn:hover:not([disabled]){transform:translateY(-2px);box-shadow:var(--shadow)}
.btn:active:not([disabled]){transform:translateY(0) scale(.96)}
.btn svg{width:15px;height:15px}
.btn.pri{background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent;color:var(--accent-ink);box-shadow:0 6px 16px -6px var(--accent)}
.btn.pri:hover:not([disabled]){filter:none;box-shadow:0 10px 22px -8px var(--accent)}
.btn.pri::before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);transform:translateX(-120%);transition:transform .6s}
.btn.pri:hover::before{transform:translateX(120%)}
.icon-btn{transition:transform .18s,background .2s,color .2s;border-radius:10px}
.icon-btn:hover{transform:scale(1.08);background:var(--surface-2)}
.icon-btn:active{transform:scale(.92)}
.ripple{position:absolute;border-radius:50%;background:currentColor;opacity:.25;transform:scale(0);animation:rip .55s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(2.6);opacity:0}}
.card,.ev2,.mail,.wd,.row{transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s,background .2s,border-color .2s}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.col{border-radius:var(--r);box-shadow:var(--shadow);border-color:transparent}
:root[data-skin="escuro"] .col{border-color:var(--line)}
.card{background:var(--surface-2);border-color:transparent;border-left-width:3px;border-radius:10px}
.ag-day{box-shadow:var(--shadow);border-color:transparent}
.ag-day.today{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft),var(--shadow)}
.tabs{border:0;background:var(--surface);padding:5px;border-radius:999px;box-shadow:var(--shadow);gap:2px;width:fit-content;max-width:100%}
.tabs button{border:0;border-radius:999px;padding:8px 14px;transition:background .2s,color .2s;display:inline-flex;align-items:center;gap:7px}
.tabs button svg{width:14px;height:14px}
.tabs button[aria-selected="true"]{background:var(--fg);color:var(--bg)}
.filters button{transition:all .2s;background:var(--surface)}
.filters button:hover{transform:translateY(-1px)}
.filters button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.hd{border-bottom:0;padding-bottom:4px}
.wrap.enter .h1 .tag{animation:tagIn .7s cubic-bezier(.2,1.4,.4,1) both .15s}
@keyframes tagIn{from{transform:rotate(-12deg) scale(.6);opacity:0}to{transform:rotate(-2deg) scale(1);opacity:1}}
.bar>span{transition:width 1s cubic-bezier(.2,.8,.2,1)}
/* entrada só com deslize: opacidade num elemento pai desliga o desfoque do vidro dos filhos até a animação terminar */
.wrap.enter>*{animation:rise .55s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0)*55ms)}
@keyframes rise{from{transform:translateY(18px)}}
.theme-btn{display:inline-flex;align-items:center;gap:8px}
.theme-mob{display:none}
@media (max-width:760px){.theme-mob{display:inline-grid;position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));z-index:30;box-shadow:var(--shadow);background:var(--surface)}}
table.tbl{background:transparent}
.tbl tr.click:hover td{background:var(--surface-2)}
.empty{background:var(--surface-2);border-color:var(--line)}

/* ---------- abertura ---------- */
#splash{position:fixed;inset:0;z-index:200;background:#121212;color:#f4f1ec;display:grid;place-items:center;padding:24px;transition:clip-path .8s cubic-bezier(.7,0,.2,1);clip-path:inset(0 0 0 0)}
#splash.out{clip-path:inset(0 0 100% 0)}
#splash[hidden]{display:none}
/* ---------- dashboards do Início ---------- */
.dash{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:16px;align-items:start}
.dcard{display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden;transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s}
.dcard::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--ac)}
.dcard:hover{transform:translateY(-3px);box-shadow:var(--shadow-up)}
.dc-hd{display:flex;align-items:center;gap:8px}
.dc-t{display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none;margin-right:auto}
.dc-t b{font:800 15px var(--font-display);letter-spacing:.06em;text-transform:uppercase}
.dc-ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--ac);background:color-mix(in srgb,var(--ac) 14%,transparent)}
.dc-ic svg{width:17px;height:17px}
.dc-go{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;color:var(--muted);transition:background .2s,color .2s,transform .2s}
.dc-go:hover{background:var(--surface-2);color:var(--ac);transform:translateX(2px)}
.dc-go svg{width:15px;height:15px}
.dcard .icon-btn svg{width:15px;height:15px}
.sts{display:flex;gap:22px;flex-wrap:wrap}
.st{display:flex;flex-direction:column;gap:2px;min-width:0}
.st .big{font-size:clamp(22px,2.3vw,30px)}
.st .big.acc{color:var(--accent)}
.st small{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.spark{width:100%;height:46px;display:block}
.mbars{display:flex;flex-direction:column;gap:7px}
.mb{display:grid;grid-template-columns:minmax(80px,auto) 1fr 28px;gap:10px;align-items:center;font-size:12.5px}
.mb-l{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px}
.mb-t{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.mb-t i{display:block;height:100%;border-radius:99px;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.mb b{text-align:right}
.wdots{display:flex;gap:6px}
.wdots span{flex:1;height:30px;border-radius:8px;display:grid;place-items:center;font-size:11px;font-weight:800;color:var(--muted);background:var(--surface-2)}
.wdots span.on{background:var(--bad);color:#fff}
.wdots span.now{outline:2px solid var(--bad);outline-offset:1px}
.dm{display:flex;flex-direction:column;padding:7px 8px;border-radius:8px;color:inherit;text-decoration:none;min-width:0}
.dm:hover{background:var(--surface-2)}
.dm b,.dm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.dm span{color:var(--muted)}
.wrap.enter .mb-t i{animation:grow 1s cubic-bezier(.2,.8,.2,1) both .2s}
@keyframes grow{from{width:0}}
.wrap.enter .spark path{stroke-dasharray:600;animation:draw 1.4s ease-out both .2s}
@keyframes draw{from{stroke-dashoffset:600}to{stroke-dashoffset:0}}

/* ---------- painel único (bento) ---------- */
.bento{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.s4{grid-column:span 4}.s6{grid-column:span 6}.s8{grid-column:span 8}.s12{grid-column:span 12}
@media (max-width:1150px){.s4{grid-column:span 6}.s8{grid-column:span 12}}
@media (max-width:720px){.s4,.s6,.s8{grid-column:span 12}}
.bento .kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:900px){.bento .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
a.kpi{color:inherit;text-decoration:none}
.w{border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:12px;min-width:0;position:relative;transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s}
.w:hover{transform:translateY(-2px)}
.w-hd{display:flex;align-items:center;gap:6px}
.w-t{display:flex;align-items:center;gap:9px;margin-right:auto;color:inherit;text-decoration:none;font:800 13px var(--font-display);letter-spacing:.08em;text-transform:uppercase}
.w-ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--ac);background:color-mix(in srgb,var(--ac) 16%,transparent);box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.w-ic svg{width:15px;height:15px}
.w-go{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;color:var(--muted);transition:background .2s,color .2s,transform .2s}
.w-go:hover{color:var(--ac);transform:translateX(2px)}
.w-go svg,.w .icon-btn svg{width:14px;height:14px}
.w .icon-btn{width:28px;height:28px}
.w-fin{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;align-items:center}
.w-2col{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
@media (max-width:720px){.w-fin,.w-2col{grid-template-columns:1fr}}
.mb{grid-template-columns:minmax(70px,auto) 1fr auto}
.tl{display:flex;flex-direction:column;gap:4px;position:relative}
.tl-i{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center;padding:7px 10px;border-radius:10px;cursor:pointer;border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 9%,transparent);transition:transform .2s,background .2s}
.tl-i:hover{transform:translateX(3px)}
.tl-i time{font-size:12px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.tl-i span{font-size:13.5px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl-i.past{opacity:.45}
.tl-i.now{box-shadow:0 0 0 2px var(--c)}
.dotc{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.rings{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ring{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.ring-g{position:relative;width:76px;height:76px}
.ring-g svg{width:100%;height:100%}
.ring-g b{position:absolute;inset:0;display:grid;place-items:center;font:800 14px var(--font-display);font-variant-numeric:tabular-nums}
.ring small{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center}
.ring-v{transition:stroke-dashoffset 1s}
.wrap.enter .ring-v{animation:ringIn 1.3s cubic-bezier(.2,.8,.2,1) both .2s}
@keyframes ringIn{from{stroke-dashoffset:var(--c)}}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.lbl{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* =========================================================
   VIDRO LÍQUIDO
   ========================================================= */
:root{--glass:rgba(255,255,255,.5);--glass-brd:rgba(255,255,255,.78);--glass-edge:rgba(255,255,255,.95);--glass-shine:rgba(255,255,255,.6);--track:rgba(20,20,20,.08);--blur:22px;
  --bg:#eceae6;--bg-2:#e4e2df}
:root[data-skin="escuro"]{--glass:rgba(28,27,26,.46);--glass-brd:rgba(255,255,255,.10);--glass-edge:rgba(255,255,255,.2);--glass-shine:rgba(255,255,255,.09);--track:rgba(255,255,255,.1);
  --bg:#0e0e0d;--bg-2:#141312}
.blobs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.blobs i{position:absolute;width:62vmax;height:62vmax;border-radius:50%;animation:blobf 26s ease-in-out infinite alternate}
.blobs i:nth-child(1){left:-12vmax;top:-18vmax;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 55%,transparent),color-mix(in srgb,var(--accent) 0%,transparent) 62%)}
.blobs i:nth-child(2){right:-18vmax;top:8vmax;background:radial-gradient(circle,rgba(61,143,224,.42),rgba(61,143,224,0) 62%);animation-delay:-9s}
.blobs i:nth-child(3){left:22vmax;bottom:-30vmax;background:radial-gradient(circle,rgba(224,83,155,.34),rgba(224,83,155,0) 62%);animation-delay:-17s}
:root[data-skin="escuro"] .blobs i{opacity:.55}
@keyframes blobf{50%{transform:translate(6vmax,5vmax) scale(1.12)}100%{transform:translate(-5vmax,8vmax) scale(.95)}}
.panel,.kpi,.w,.col,.ag-day,.tabs,.rail,.btn:not(.pri),.icon-btn,.filters button,dialog,.card,.inp,.f input,.f select,.f textarea,.empty,.theme-mob,.wd,.date-box,.mail-wrap>.panel{
  background:linear-gradient(140deg,var(--glass-shine) 0%,rgba(255,255,255,0) 42%),radial-gradient(260px circle at var(--mx,-400px) var(--my,-400px),var(--glass-shine),rgba(255,255,255,0) 65%),var(--glass)!important;
  -webkit-backdrop-filter:blur(var(--blur)) saturate(180%);backdrop-filter:blur(var(--blur)) saturate(180%);
  border:1px solid var(--glass-brd)!important;
  box-shadow:inset 0 1px 0 var(--glass-edge),inset 0 -1px 1px rgba(255,255,255,.06),var(--shadow)}
.card{border-left:3px solid var(--c,var(--glass-brd))!important}
.btn:not(.pri),.icon-btn,.filters button,.inp,.f input,.f select,.f textarea{box-shadow:inset 0 1px 0 var(--glass-edge),0 1px 2px rgba(0,0,0,.06);--blur:14px}
.btn.pri{box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -2px 6px rgba(0,0,0,.12),0 8px 20px -8px var(--accent)}
.tabs button[aria-selected="true"],.filters button[aria-pressed="true"]{background:var(--fg)!important;color:var(--bg)}
.filters button[aria-pressed="true"]{border-color:transparent!important}
.nav a[aria-current="page"]{background:var(--fg);box-shadow:0 6px 16px -8px rgba(0,0,0,.4)}
.kpi.hot{background:linear-gradient(140deg,rgba(255,255,255,.4) 0%,rgba(255,255,255,0) 45%),linear-gradient(140deg,color-mix(in srgb,var(--accent) 88%,transparent),color-mix(in srgb,var(--accent-2) 78%,transparent))!important;color:var(--accent-ink);border-color:color-mix(in srgb,var(--accent-2) 70%,white)!important}
.kpi.hot .l,.kpi.hot .d{color:var(--accent-ink)}
.kpi.hot .kpi-ic{background:rgba(255,255,255,.3);color:var(--accent-ink)}
.kpi.hot::after{background:radial-gradient(circle,#fff,transparent 70%)}
.kpi-ic{box-shadow:inset 0 1px 0 rgba(255,255,255,.45)}
dialog{--blur:30px}
dialog::backdrop{background:rgba(10,10,10,.35);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.ev2:not(.qg),.tl-i,.dm,.mail{-webkit-backdrop-filter:none;backdrop-filter:none}
.ag-day.today{border-color:var(--accent)!important}
@media (max-width:760px){:root{--blur:14px}}
@media (prefers-reduced-motion:reduce){.blobs i{animation:none}}

/* ---------- prioridade dos e-mails ---------- */
.prio{border-left:4px solid var(--pc)!important}
.prio-hd{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer}
.prio-hd:focus-visible{outline:2px solid var(--accent)}
.prio-n,.urg .prio-n{font:850 22px/1 var(--font-display);letter-spacing:-.04em;color:var(--pc);min-width:34px}
.prio-t{display:flex;flex-direction:column;flex:1;min-width:0}
.prio-t b{font:800 13px var(--font-display);letter-spacing:.08em;text-transform:uppercase}
.prio-t small{font-size:12px;color:var(--muted)}
.prio-c{font:800 15px var(--font-display);color:var(--muted)}
.prio-hd[aria-expanded="false"]{opacity:.85}
.prio .mail:first-of-type{border-top:1px solid var(--line)}
.prio-mais{all:unset;display:block;padding:10px 16px;font-size:12.5px;font-weight:700;color:var(--pc);cursor:pointer}
.urg{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:12px;background:color-mix(in srgb,#d4443a 10%,transparent);border:1px solid color-mix(in srgb,#d4443a 30%,transparent)}
.prio-icons{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.pi{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 8px 12px;border-radius:16px;text-align:center;position:relative;transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s;
  background:linear-gradient(140deg,var(--glass-shine) 0%,rgba(255,255,255,0) 42%),var(--glass);-webkit-backdrop-filter:blur(var(--blur)) saturate(180%);backdrop-filter:blur(var(--blur)) saturate(180%);border:1px solid var(--glass-brd);box-shadow:inset 0 1px 0 var(--glass-edge),var(--shadow)}
.pi:hover{transform:translateY(-3px)}
.pi:focus-visible{outline:2px solid var(--pc);outline-offset:2px}
.pi.on{box-shadow:inset 0 1px 0 var(--glass-edge),0 0 0 2px var(--pc),0 12px 28px -12px var(--pc);transform:translateY(-2px)}
.pi-ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:var(--pc);background:color-mix(in srgb,var(--pc) 15%,transparent);position:relative;box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.pi.on .pi-ic{background:var(--pc);color:#fff}
.pi-ic svg{width:22px;height:22px}
.pi-dot{position:absolute;top:-6px;right:-8px;min-width:20px;height:20px;padding:0 5px;border-radius:99px;background:var(--pc);color:#fff;font:800 11px/20px var(--font-body);font-style:normal;box-shadow:0 0 0 2px var(--surface)}
.pi-n{font:850 18px/1 var(--font-display);letter-spacing:-.03em;color:var(--pc);margin-top:4px}
.pi-l{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.pi-c{font-size:12px;color:var(--muted)}
.mail-wrap.solo{grid-template-columns:1fr}
.mail-wrap.solo .prio-icons{max-width:760px}
.prio-open{animation:rise .35s cubic-bezier(.2,.8,.2,1) backwards}
@media (max-width:520px){.pi-l{font-size:9.5px;letter-spacing:.04em}.pi-ic{width:40px;height:40px}}
/* ---------- finanças numa página ---------- */
.kpi-meta{grid-column:span 2;display:flex;flex-direction:row!important;gap:18px;align-items:center}
.kpi-meta .kpi-ic{display:none}
.mt-v{font:800 clamp(18px,1.8vw,24px)/1.1 var(--font-display);letter-spacing:-.02em}
.mt-v .muted{font-size:.7em;font-weight:700}
.mt-g{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mt-g>div{display:flex;flex-direction:column;gap:1px;min-width:0}
.mt-g small{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mt-g b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mt-g em{font-style:normal;font-size:11.5px;color:var(--muted)}
.saude-fim{grid-template-columns:1fr!important}
.saude-fim .kpi-saude{grid-column:1/-1}
@media (max-width:900px){.kpi-meta{grid-column:1/-1}}
@media (max-width:560px){.kpi-meta{flex-direction:column!important;align-items:flex-start}.mt-g{grid-template-columns:1fr 1fr}}

.icon-btn[disabled]{opacity:.3;cursor:not-allowed;transform:none}

.kpi-pat{cursor:pointer}

<script>
/* =========================================================
   Utilidades
   ========================================================= */
/* =========================================================
   PERFIL: edite aqui para personalizar o seu QG
   ========================================================= */
const PERFIL_PADRAO={nome:'',marca:'meuqg',slogan:'Trabalho // Estudos // Vida',bio:'',sobre:'',email:'',instagram:'',tom:'direto',publico:'',pilares:['Dicas','Bastidores','Cases','Pessoal','Educativo','Novidades'],urgentes:[],cor:'#3d7bfd',tema:'claro'};
let PERFIL=(()=>{try{return Object.assign({},PERFIL_PADRAO,JSON.parse(localStorage.getItem('qg:perfil')||'null')||{})}catch(e){return Object.assign({},PERFIL_PADRAO)}})();
const PERFIL_OK=()=>{try{return !!localStorage.getItem('qg:perfil')}catch(e){return false}};
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const BRL=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
const brl=n=>BRL.format(+n||0);
const brlK=n=>{n=+n||0;const a=Math.abs(n);return a>=1e6?'R$ '+(n/1e6).toFixed(1).replace('.',',')+' mi':a>=1e4?'R$ '+(n/1e3).toFixed(1).replace('.',',')+' mil':brl(n)};
const nf=(n,d=0)=>(+n||0).toLocaleString('pt-BR',{maximumFractionDigits:d,minimumFractionDigits:d});
const pad=n=>String(n).padStart(2,'0');
const isoOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>isoOf(new Date());
const curYM=()=>today().slice(0,7);
const MES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const MESF=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const DOW=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const DOWF=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const fmtD=iso=>iso?iso.slice(8,10)+'/'+iso.slice(5,7):'—';
const fmtDL=iso=>iso?(+iso.slice(8,10))+' '+MES[+iso.slice(5,7)-1]:'—';
const ymLabel=ym=>MESF[+ym.slice(5,7)-1]+' '+ym.slice(0,4);
const INICIO_QG=null;const inicioQG=()=>(typeof S!=='undefined'&&S.config&&S.config.inicio)||(typeof S!=='undefined'?[...Object.keys(S.lanc||{}),curYM()].sort()[0]:curYM());
const desdeInicio=ms=>ms.filter(m=>m>=inicioQG());
const ymShift=(ym,k)=>{const d=new Date(+ym.slice(0,4),+ym.slice(5,7)-1+k,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)};
const daysTo=iso=>Math.round((new Date(iso+'T12:00')-new Date(today()+'T12:00'))/864e5);
const parseNum=v=>{if(typeof v==='number')return v;v=String(v??'').trim().replace(/[R$\s]/g,'');if(!v)return 0;
  if(v.includes(','))v=v.replace(/\./g,'').replace(',','.');else if(/^-?\d{1,3}(\.\d{3})+$/.test(v))v=v.replace(/\./g,''); // 180.000 = cento e oitenta mil
  const n=parseFloat(v);return isNaN(n)?0:n};
const sum=(a,f=x=>x)=>a.reduce((s,x)=>s+(+f(x)||0),0);
const clone=o=>JSON.parse(JSON.stringify(o??null));
function desfazer(msg,fn){let el=document.getElementById('undo');if(!el){el=document.createElement('div');el.id='undo';el.setAttribute('role','status');document.body.appendChild(el)}
  el.innerHTML='<span></span><button type="button">Desfazer</button>';el.firstChild.textContent=msg;el.classList.add('on');
  el.lastChild.onclick=()=>{clearTimeout(desfazer.t);el.classList.remove('on');fn()};clearTimeout(desfazer.t);desfazer.t=setTimeout(()=>el.classList.remove('on'),7000)}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2200)}
const PRIO_LBL={alta:['Alta','pr-alta','▲'],media:['Média','pr-media','●'],baixa:['Baixa','pr-baixa','▼']};
const prioBadge=p=>{const x=PRIO_LBL[p]||PRIO_LBL.media;return `<span class="badge pr ${x[1]}" title="Prioridade ${x[0].toLowerCase()}"><i aria-hidden="true">${x[2]}</i>${x[0]}</span>`};
function prazoBadge(iso,done){if(!iso)return '<span class="badge">sem prazo</span>';if(done)return `<span class="badge">${fmtD(iso)}</span>`;const d=daysTo(iso);
  if(d<0)return `<span class="badge bad">atrasada ${-d}d</span>`;if(d===0)return '<span class="badge warn">hoje</span>';if(d===1)return '<span class="badge warn">amanhã</span>';if(d<=7)return `<span class="badge acc">em ${d} dias</span>`;return `<span class="badge">${fmtD(iso)}</span>`}

/* =========================================================
   Estado + persistência (banco do Artifact, com cópia local)
   ========================================================= */
const CATS=['Moradia','Alimentação','Transporte','Saúde','Educação','Lazer','Assinaturas','Empresas','Compras','Impostos','Pessoal','Investimento','Outros'];
const CAT_RULES=[[/ifood|rappi|restaur|lanch|padaria|mercad|supermerc|atacad|assai|carrefour|pão de/i,'Alimentação'],[/uber|99|posto|combust|ipiranga|shell|estacion|pedágio|onibus|metro/i,'Transporte'],[/netflix|spotify|youtube|prime|disney|hbo|apple\.com|google|icloud|adobe|canva|chatgpt|openai|claude|anthropic|capcut/i,'Assinaturas'],[/farm|drog|droga|raia|pacheco|academia|smartfit|clinic|médic|medic|hospital|lab/i,'Saúde'],[/aluguel|condom|energia|enel|light|cemig|celpe|coelba|água|saneam|internet|vivo|claro|tim|oi /i,'Moradia'],[/facul|curso|udemy|alura|livro|amazon.*kindle|escola/i,'Educação'],[/cinema|ingresso|bar |show|steam|playstation|xbox/i,'Lazer'],[/das|simples nac|darf|iptu|ipva|imposto/i,'Impostos'],[/shopee|mercadolivre|mercado livre|amazon|magalu|shein|aliexpress|renner|riachuelo/i,'Compras'],[/tesouro|cdb|corretora|xp inv|rico|nuinvest|btg|invest/i,'Investimento']];
const autoCat=d=>{for(const[r,c] of CAT_RULES)if(r.test(d))return c;return 'Outros'};

const DEF={
  config:{empresas:[{id:'emp1',nome:'Empresa 1',cor:'#3d8fe0'},{id:'emp2',nome:'Empresa 2',cor:'#a274f0'},{id:'proj',nome:'Projetos',cor:'#3fbf8a'},{id:'pessoal',nome:'Pessoal',cor:'#f26b1d'}]},
  fin:{rendas:[],fixas:[],invest:[],limiteVar:0,metaReserva:0,pagos:{},patrimonio:{bens:[],dividas:[],hist:{}},hipoteses:[]},
  dem:{items:[]},
  saude:{peso:[],metaPeso:0,altura:0,refeicoes:[],metaKcal:0,metaProt:0,agua:{},metaAgua:3000,treinos:[0,1,2,3,4,5,6].map(d=>({dia:d,nome:'',exercicios:''})),checkins:[],registros:{}},
  estudos:{livros:[],fac:[],metaLivros:12},
  cont:{posts:[],metricas:[],handle:PERFIL.instagram},
  rotina:{dias:{},modelos:{}},
  agenda:{eventos:[]}
};
const KEYS=Object.keys(DEF);
const S={lanc:{}};
KEYS.forEach(k=>S[k]=clone(DEF[k]));
const dirty={},timers={};
let db=null,mode='local',loadedAny=false;

function lsGet(k){try{return JSON.parse(localStorage.getItem('qg:'+k))}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem('qg:'+k,JSON.stringify(v))}catch(e){}}
function withDefaults(k,v){return Object.assign(clone(DEF[k]),v||{})}
function loadLocal(){KEYS.forEach(k=>{const v=lsGet(k);if(v)S[k]=withDefaults(k,v)});const l=lsGet('lanc');if(l)S.lanc=l}

function commit(k){ // k = 'fin' | 'lanc:2026-11' ...
  dirty[k]=true;clearTimeout(timers[k]);timers[k]=setTimeout(()=>flush(k),450);
  if(k.startsWith('lanc:'))lsSet('lanc',S.lanc);else lsSet(k,S[k]);
  render();
}
async function flush(k){
  if(mode!=='db'){dirty[k]=false;return}
  try{
    if(k.startsWith('lanc:')){const m=k.slice(5);const items=S.lanc[m]||[];
      if(items.length)await db.doc('lanc/'+m).set({items:clone(items)});else await db.doc('lanc/'+m).delete();}
    else await db.doc('qg/'+k).set(clone(S[k]));
    dirty[k]=false;setSync('ok');
  }catch(e){dirty[k]=false;setSync('err',e&&e.code==='quota_exceeded'?'Espaço cheio':'Erro ao salvar');toast('Não salvou: '+(e&&e.message||'erro'))}
}
function setSync(s,txt){const el=$('#sync');el.dataset.s=s;el.lastElementChild.textContent=txt||(s==='ok'?'Salvo na nuvem':s==='local'?'Salvo neste aparelho':'Erro')}

async function initStore(){
  loadLocal();render();
  try{if(window.claude&&claude.use)db=await claude.use('db')}catch(e){db=null}
  if(!db){mode='local';setSync('local');return}
  mode='db';setSync('ok','Sincronizando…');
  const t=setTimeout(()=>{if(!loadedAny)setSync('err','Sem conexão com o banco')},10000);
  KEYS.forEach(k=>{
    db.doc('qg/'+k).onSnapshot(s=>{
      if(!s.metadata.fromCache){loadedAny=true;clearTimeout(t);setSync('ok')}
      if(dirty[k])return;
      if(s.exists){S[k]=withDefaults(k,clone(s.data()));lsSet(k,S[k])}
      render();
    },e=>setSync('err','Banco indisponível'));
  });
  db.collection('lanc').onSnapshot(q=>{
    const next={};q.docs.forEach(d=>{next[d.id]=clone(d.data().items||[])});
    Object.keys(S.lanc).forEach(m=>{if(dirty['lanc:'+m])next[m]=S.lanc[m]});
    S.lanc=next;lsSet('lanc',S.lanc);render();
  },e=>setSync('err','Banco indisponível'));
}

/* =========================================================
   Formulário genérico (dialog)
   ========================================================= */
let formCb=null;
function openForm({title,fields,value={},onSave,onDelete,saveLabel='Salvar'}){
  const d=$('#dlg');
  const fld=f=>{const v=value[f.k]??f.def??'';const id='f_'+f.k;const cls='f'+(f.full||f.type==='textarea'?' full':'');
    if(f.type==='select')return `<div class="${cls}"><label for="${id}">${f.label}</label><select id="${id}" name="${f.k}">${f.options.map(o=>{const[val,lab]=Array.isArray(o)?o:[o,o];return `<option value="${esc(val)}" ${String(val)===String(v)?'selected':''}>${esc(lab)}</option>`}).join('')}</select></div>`;
    if(f.type==='textarea')return `<div class="${cls}"><label for="${id}">${f.label}</label><textarea id="${id}" name="${f.k}" placeholder="${esc(f.ph||'')}">${esc(v)}</textarea></div>`;
    if(f.type==='check')return `<div class="${cls}"><label>&nbsp;</label><span class="check"><input type="checkbox" id="${id}" name="${f.k}" ${v?'checked':''}><label for="${id}" style="text-transform:none;letter-spacing:0;font-size:14px;color:var(--fg)">${f.label}</label></span></div>`;
    const t=f.type==='money'||f.type==='num'?'text':f.type||'text';
    const val=f.type==='money'&&v!==''?nf(v,2):f.type==='num'&&v!==''?String(v).replace('.',','):v;
    return `<div class="${cls}"><label for="${id}">${f.label}</label><input id="${id}" name="${f.k}" type="${t}" ${f.type==='money'||f.type==='num'?'inputmode="decimal"':''} value="${esc(val)}" placeholder="${esc(f.ph||'')}" ${f.req?'required':''}></div>`};
  d.innerHTML=`<form class="dlg" method="dialog" id="frm">
    <div class="dlg-hd"><h3 class="h2">${esc(title)}</h3><button type="button" class="icon-btn" data-close aria-label="Fechar">✕</button></div>
    <div class="dlg-bd">${fields.map(fld).join('')}</div>
    <div class="dlg-ft">${onDelete?'<button type="button" class="btn ghost danger sp" id="delBtn">Excluir</button>':''}<button type="button" class="btn ghost" data-close>Cancelar</button><button class="btn pri" type="submit">${esc(saveLabel)}</button></div></form>`;
  d.showModal();
  $$('[data-close]',d).forEach(b=>b.onclick=()=>d.close());
  const del=$('#delBtn',d);
  if(del)del.onclick=()=>{if(del.dataset.armed){onDelete();d.close();toast('Excluído')}else{del.dataset.armed=1;del.textContent='Confirmar exclusão'}};
  $('#frm',d).onsubmit=e=>{e.preventDefault();const o={};
    fields.forEach(f=>{const el=$('#f_'+f.k,d);if(!el)return;o[f.k]=f.type==='check'?el.checked:(f.type==='money'||f.type==='num')?parseNum(el.value):el.value.trim()});
    onSave(o);d.close();toast('Salvo')};
  setTimeout(()=>{const first=$('input:not([type=checkbox]),textarea,select',d);first&&first.focus()},30);
}
function crud(list,item,fields,title,commitKey,extra={}){

  const recExtra=sum(items.filter(i=>i.valor>0),i=>i.valor);
  const fixas=sum(ativos(S.fin.fixas),x=>x.valor);
  const gastos=items.filter(i=>i.valor<0);
  const aportes=sum(gastos.filter(i=>i.categoria==='Investimento'),i=>-i.valor);
  const variaveis=sum(gastos.filter(i=>i.categoria!=='Investimento'),i=>-i.valor);
  const receitas=rendas+recExtra,despesas=fixas+variaveis;
  const porCat={};ativos(S.fin.fixas).forEach(x=>porCat[x.categoria||'Outros']=(porCat[x.categoria||'Outros']||0)+(+x.valor||0));
  gastos.filter(i=>i.categoria!=='Investimento').forEach(i=>porCat[i.categoria||'Outros']=(porCat[i.categoria||'Outros']||0)-i.valor);

function prepImport(tx){
  const exist=new Set(Object.values(S.lanc).flat().map(x=>x.fitid||(x.data+'|'+x.valor+'|'+x.desc)));
  const fixNames=S.fin.fixas.map(f=>f.nome.toLowerCase()).filter(n=>n.length>3);
  importPrev=tx.map(t=>{const key=t.fitid||(t.data+'|'+t.valor+'|'+t.desc);const ig=t.ignorar||(t.valor<0&&fixNames.some(n=>t.desc.toLowerCase().includes(n)));
    return Object.assign(t,{dup:exist.has(key),sel:!exist.has(key),categoria:t.categoria||(t.valor>0?'Outros':autoCat(t.desc)),ignorar:ig})});
}
function parseImport(txt,name){
  let tx=/<OFX>|<STMTTRN>/i.test(txt)?parseOFX(txt):parseCSV(txt);
  if(!tx.length){toast('Não encontrei transações nesse arquivo');return}
  prepImport(tx);
  render();toast(tx.length+' transações lidas de '+name);
}
function parseOFX(txt){const out=[];const blocks=txt.split(/<STMTTRN>/i).slice(1);
  for(const b of blocks){const g=t=>{const m=b.match(new RegExp('<'+t+'>([^<\\r\\n]*)','i'));return m?m[1].trim():''};
    const d=g('DTPOSTED');const v=parseFloat(g('TRNAMT').replace(',','.'));if(!d||isNaN(v))continue;
    out.push({data:d.slice(0,4)+'-'+d.slice(4,6)+'-'+d.slice(6,8),valor:Math.round(v*100)/100,desc:(g('MEMO')||g('NAME')||'Transação').replace(/\s+/g,' '),fitid:g('FITID')?'ofx:'+g('FITID'):''})}
  return out}
function splitCSV(line,sep){const r=[];let cur='',q=false;for(const ch of line){if(ch==='"'){q=!q;continue}if(ch===sep&&!q){r.push(cur);cur='';continue}cur+=ch}r.push(cur);return r.map(s=>s.trim())}
function parseCSV(txt){const lines=txt.split(/\r?\n/).filter(l=>l.trim());if(lines.length<2)return[];
  const sep=(lines[0].match(/;/g)||[]).length>(lines[0].match(/,/g)||[]).length?';':',';
  const H=splitCSV(lines[0],sep).map(h=>h.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''));
  const fi=re=>H.findIndex(h=>re.test(h));
  const iD=fi(/^data|date/),iV=fi(/valor|amount|quantia/),iT=fi(/descri|title|historico|estabelec|memo|lancamento/),iId=fi(/identificador|^id$/);
  const isCard=H.includes('title')&&!H.some(h=>/identificador/.test(h));
  if(iD<0||iV<0)return[];
  const out=[];
  for(const l of lines.slice(1)){const c=splitCSV(l,sep);let d=c[iD]||'';
    if(/^\d{2}\/\d{2}\/\d{4}/.test(d))d=d.slice(6,10)+'-'+d.slice(3,5)+'-'+d.slice(0,2);else d=d.slice(0,10);
    if(!/^\d{4}-\d{2}-\d{2}$/.test(d))continue;
    let v=parseNum(c[iV]);if(isCard)v=-v; // fatura do Nubank: compras vêm positivas
    if(!v)continue;
    out.push({data:d,valor:Math.round(v*100)/100,desc:(c[iT]||'Transação').replace(/\s+/g,' '),fitid:iId>=0&&c[iId]?'csv:'+c[iId]:''})}
  return out}
function importOk(){const touched=new Set();let n=0;
  importPrev.filter(x=>x.sel&&!x.dup).forEach(x=>{const m=x.data.slice(0,7);(S.lanc[m]=S.lanc[m]||[]).push({id:uid(),data:x.data,desc:x.desc,valor:x.valor,categoria:x.categoria,ignorar:x.ignorar,origem:'banco',fitid:x.fitid||(x.data+'|'+x.valor+'|'+x.desc)});touched.add(m);n++});
  importPrev=[];touched.forEach(m=>commit('lanc:'+m));toast(n+' lançamentos importados');setTimeout(()=>{const el=document.getElementById('fin-var');el&&el.scrollIntoView({behavior:'smooth'})},300);const ms=[...touched].sort();if(ms.length)ui.finMes=ms[ms.length-1];render()}

function weekDates(){const d=new Date();const dow=(d.getDay()+6)%7;d.setDate(d.getDate()-dow);return [...Array(7)].map((_,i)=>{const x=new Date(d);x.setDate(d.getDate()+i);return isoOf(x)})}
function streak(){let n=0;const d=new Date();if(!S.saude.checkins.includes(today()))d.setDate(d.getDate()-1);
  const plan=new Set(S.saude.treinos.filter(t=>t.nome).map(t=>t.dia));
  for(let i=0;i<400;i++){const iso=isoOf(d);if(S.saude.checkins.includes(iso))n++;else if(plan.has(d.getDay()))break;d.setDate(d.getDate()-1)}return n}
/* =========================================================
   SAÚDE: registro diário de treino e dieta + relatórios
   ========================================================= */
const sdDia=()=>ui.sdDia||today();
const sdRegs=()=>S.saude.registros||{};
function sdReg(d,criar){const R=sdRegs();if(!R[d]&&criar){S.saude.registros=Object.assign({},R,{[d]:{}});}return (S.saude.registros||{})[d]||null}
const exLinhas=t=>String((t&&t.exercicios)||'').split('\n').map(x=>x.trim()).filter(Boolean);
const planoTreino=d=>{const dow=new Date(d+'T12:00').getDay();return S.saude.treinos.find(t=>t.dia===dow)||{dia:dow,nome:'',exercicios:''}};
const ehDescanso=t=>!t||!t.nome||/descanso|folga|off/i.test(t.nome);
function treinoDo(d){const r=sdReg(d);const p=planoTreino(d);
  if(r&&r.t)return {nome:r.t.nome,ex:r.t.ex||[],st:r.t.st||null,obs:r.t.obs||'',salvo:true};
  const st=S.saude.checkins.includes(d)?'feito':null;
  return {nome:p.nome,ex:exLinhas(p).map(n=>({n,ok:false})),st,obs:'',salvo:false}}
function treinoSalvar(d,t){const r=sdReg(d,true);r.t={nome:t.nome,ex:t.ex,st:t.st,obs:t.obs||''};
  const c=new Set(S.saude.checkins);if(t.st==='feito')c.add(d);else c.delete(d);S.saude.checkins=[...c].sort().slice(-400);
  sdLimpar();commit('saude')}
function dietaDo(d){const r=sdReg(d);const refs=(r&&r.d&&r.d.refs)||{};const plano=[...S.saude.refeicoes].sort((a,b)=>(a.hora||'').localeCompare(b.hora||''));
  const L=plano.map(m=>Object.assign({id:m.id,n:m.nome,h:m.hora||'',k:+m.kcal||0,p:+m.prot||0,itens:m.itens||''},refs[m.id]?{ok:refs[m.id].ok}:{ok:null}));
  Object.keys(refs).forEach(id=>{if(!plano.some(m=>m.id===id)){const x=refs[id];L.push({id,n:x.n,h:x.h||'',k:x.k||0,p:x.p||0,ok:x.ok,antiga:true})}});
  return L}
function sdLimpar(){const R=S.saude.registros||{};const lim=addDays(today(),-400);Object.keys(R).forEach(k=>{if(k<lim)delete R[k]})}

function sdHoje(){const d=sdDia();const dt=new Date(d+'T12:00');const t=treinoDo(d);const D=dietaDo(d);const s=S.saude;

    </div></section>`}

function sdPeriodo(){const n=+(ui.sdPer||30);const out=[];for(let i=n-1;i>=0;i--)out.push(addDays(today(),-i));return out}
function sdStats(){const dias=sdPeriodo();const per=[];const ini=[...Object.keys(sdRegs()),...S.saude.checkins].sort()[0]||today();
  dias.forEach(d=>{const t=treinoDo(d);const plan=(d>=ini&&!ehDescanso(planoTreino(d)))||!!t.st;const D=dietaDo(d);const marc=D.filter(m=>m.ok!==null);
    per.push({d,tPlan:plan&&!ehDescanso({nome:t.nome}),tSt:t.st,ex:t.ex,salvo:t.salvo,dTot:D.length,dOk:D.filter(m=>m.ok===true).length,dMarc:marc.length,kc:sum(D.filter(m=>m.ok),m=>m.k),pr:sum(D.filter(m=>m.ok),m=>m.p)})});
  const tp=per.filter(x=>x.tPlan||x.tSt);const tf=per.filter(x=>x.tSt==='feito');
  const dReg=per.filter(x=>x.dMarc>0);const dOk=sum(dReg,x=>x.dOk),dTot=sum(dReg,x=>x.dTot);
  const pul={};per.forEach(x=>{if(x.tSt&&x.salvo)x.ex.forEach(e=>{if(!e.ok){pul[e.n]=(pul[e.n]||0)+1}})});
  return {per,tPlan:tp.length,tFeito:tf.length,tNao:per.filter(x=>x.tSt==='nao').length,dDias:dReg.length,dAd:dTot?dOk/dTot:0,
    kcMed:dReg.length?sum(dReg,x=>x.kc)/dReg.length:0,prMed:dReg.length?sum(dReg,x=>x.pr)/dReg.length:0,pulados:Object.entries(pul).sort((a,b)=>b[1]-a[1]).slice(0,5)}}
function sdRelatorio(){const s=sdStats();const n=+(ui.sdPer||30);const ad=s.tPlan?s.tFeito/s.tPlan:0;

      <div class="kpi"><span class="l">Sequência de treinos</span><span class="v">${streak()} dias</span><span class="d">${s.tNao} treino(s) marcados como não feito</span></div>
      <div class="kpi"><span class="l">Dieta seguida</span><span class="v">${s.dDias?Math.round(s.dAd*100)+'%':'—'}</span><span class="d">${s.dDias} dia(s) registrados</span></div>
      <div class="kpi"><span class="l">Média por dia</span><span class="v">${s.dDias?nf(s.kcMed)+' kcal':'—'}</span><span class="d">${s.dDias?nf(s.prMed)+' g de proteína':'marque as refeições para ver'}</span></div></section>
    <section class="panel"><div class="panel-hd"><h2 class="h2">Mapa dos dias</h2><span class="hstack small muted" style="gap:10px"><span><i class="lg ok"></i>fez / seguiu</span><span><i class="lg meio"></i>dieta parcial</span><span><i class="lg no"></i>não fez</span><span><i class="lg desc"></i>descanso</span></span></div>
      <div class="hm"><div class="hm-lbl"><span>Treino</span><span>Dieta</span></div><div class="hm-g">${s.per.map(cel).join('')}</div></div>
      <div class="split small muted" style="margin-top:6px"><span>${fmtD(s.per[0].d)}</span><span>hoje</span></div></section>
    <div class="grid g-main" style="align-items:start">
      <section class="panel"><div class="panel-hd"><h2 class="h2">Calorias por dia</h2><span class="muted small">${S.saude.metaKcal?'meta '+nf(S.saude.metaKcal)+' kcal':'defina a meta em Metas'}</span></div>${s.dDias?'<div class="chart-box"><canvas id="chKcal"></canvas></div>':'<div class="empty">Marque as refeições do dia para ver o gráfico.</div>'}</section>
      <section class="panel"><div class="panel-hd"><h2 class="h2">Exercícios mais pulados</h2></div>${s.pulados.length?minibars(s.pulados.map(([n,v])=>({l:n,v,c:tok('--bad')}))):'<div class="empty">Nada pulado no período. 💪</div>'}</section>
    </div></section>`}
function sdAfter(){const s=sdStats();const P=s.per.filter(x=>x.dMarc>0);if(P.length){const meta=+S.saude.metaKcal||0;
  const ds=[{label:'Calorias',data:P.map(x=>x.kc),backgroundColor:P.map(x=>!meta?tok('--accent'):x.kc>meta*1.1?tok('--bad'):x.kc>=meta*.85?tok('--ok'):tok('--warn')),borderRadius:5,maxBarThickness:22}];
  if(meta)ds.push({label:'Meta',type:'line',data:P.map(()=>meta),borderColor:tok('--muted'),borderDash:[5,5],pointRadius:0});

const GCAL='Google Calendar',GMAIL='Gmail';
const G={cal:{},today:{},mail:{},unread:{},thread:{id:null,data:null,err:null,loading:false,resumo:''}};
const mcpGoogle=(async()=>{try{return window.claude&&claude.use?await claude.use('mcp'):null}catch(e){return null}})();
const DENY=['needs_reauth','server_not_connected','blocked_by_policy','approval_required','not_in_manifest','selection_required'];
function gWatch(slot,server,tool,input,refetch){
  const key=JSON.stringify([server,tool,input]);if(slot.key===key)return;
  slot.unsub&&slot.unsub();Object.assign(slot,{key,server,tool,input,data:null,err:null,loading:true,unsub:null});
  mcpGoogle.then(mcp=>{if(slot.key!==key)return;
    if(!mcp){slot.loading=false;slot.err={code:'no_mcp'};render();return}
    slot.unsub=mcp.watchTool(server,tool,input,ev=>{if(slot.key!==key)return;slot.loading=false;
      if(ev.type==='data'){slot.data=ev.result.payload;slot.err=null;slot.at=(ev.result.cache&&ev.result.cache.storedAt)||Date.now()}
      else{if(DENY.includes(ev.error.code))slot.data=null;slot.err=ev.error}
      render()},{refetchInterval:refetch||300000});
  })}
async function gAllow(slot){const mcp=await mcpGoogle;if(!mcp)return;slot.loading=true;render();
  try{const r=await mcp.callTool(slot.server,slot.tool,slot.input);slot.data=r.payload;slot.err=null}catch(e){slot.err=e}slot.loading=false;render()}
function gErr(slot,what){const e=slot.err;if(!e)return '';const s=e.server||slot.server;const c=e.code;
  const msg=c==='no_mcp'?`${what} aparece quando o QG é aberto no claude.ai ou no app Claude.`
   :c==='needs_reauth'?`A conexão com ${s} expirou. Reconecte em claude.ai › Configurações › Conectores.`
   :c==='server_not_connected'?`${s} não está conectado. Adicione em claude.ai › Configurações › Conectores, com a sua conta Google.`
   :c==='approval_required'||c==='not_in_manifest'?`O QG precisa da sua permissão para ler ${s}.`
   :c==='selection_required'?`Você tem mais de uma conta ${s} conectada. Escolha qual usar no aviso do claude.ai.`
   :c==='blocked_by_policy'?`${s} está bloqueado pela política da sua conta.`
   :`Não deu para carregar ${what.toLowerCase()} agora.`;
  const btn=c==='approval_required'||c==='not_in_manifest'||(!DENY.includes(c)&&c!=='no_mcp')?`<button class="btn sm" data-act="gAllow" data-slot="${slot===G.cal?'cal':slot===G.today?'today':slot===G.mail?'mail':'unread'}">${c==='approval_required'||c==='not_in_manifest'?'Permitir acesso':'Tentar de novo'}</button>`:'';
  return `<div class="note hstack" style="justify-content:space-between">${esc(msg)}${btn}</div>`}
const safeUrl=(u,hosts)=>{try{const x=new URL(u);return x.protocol==='https:'&&hosts.some(h=>x.hostname===h||x.hostname.endsWith('.'+h))?x.href:''}catch(e){return ''}};
const addDays=(iso,n)=>{const d=new Date(iso+'T12:00');d.setDate(d.getDate()+n);return isoOf(d)};
const monday=iso=>{const d=new Date(iso+'T12:00');d.setDate(d.getDate()-((d.getDay()+6)%7));return isoOf(d)};
const hhmm=d=>d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
const GCOR={1:'#7986cb',2:'#33b679',3:'#8e24aa',4:'#e67c73',5:'#f6bf26',6:'#f4511e',7:'#039be5',8:'#8c8580',9:'#3f51b5',10:'#0b8043',11:'#d50000'};
function evNorm(e){const all=!!(e.start&&e.start.date&&!e.start.dateTime);
  const ini=all?new Date(e.start.date+'T00:00'):new Date(e.start&&e.start.dateTime);const fim=all?new Date((e.end&&e.end.date||e.start.date)+'T00:00'):new Date(e.end&&e.end.dateTime);
  const meet=e.hangoutLink||(e.conferenceData&&e.conferenceData.entryPoints&&(e.conferenceData.entryPoints.find(p=>p.entryPointType==='video')||{}).uri)||'';
  return {id:e.id,rec:!!e.recurringEventId,meetOn:!!meet,titulo:e.summary||'(sem título)',ini,fim,all,dia:all?e.start.date:isoOf(ini),local:e.location||'',desc:e.description||'',link:safeUrl(e.htmlLink,['google.com']),meet:safeUrl(meet,['meet.google.com','zoom.us']),cor:GCOR[e.colorId]||tok('--info')}}

function spark(vals,color,h=46){const v=vals.filter(x=>isFinite(x));if(v.length<2)return `<svg class="spark" viewBox="0 0 200 ${h}" preserveAspectRatio="none"><line x1="0" y1="${h-4}" x2="200" y2="${h-4}" stroke="var(--line)" stroke-width="2" stroke-dasharray="4 5"/></svg>`;
  const mn=Math.min(...v),mx=Math.max(...v),rg=mx-mn||1;const pts=v.map((x,i)=>[i*200/(v.length-1),h-5-(x-mn)/rg*(h-12)]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');const l=pts[pts.length-1];
  return `<svg class="spark" viewBox="0 0 200 ${h}" preserveAspectRatio="none" aria-hidden="true"><path d="${d} L200 ${h} L0 ${h}Z" fill="${color}" opacity=".13"/><path d="${d}" fill="none" stroke="${color}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><circle cx="${l[0]}" cy="${l[1]}" r="3.6" fill="${color}"/></svg>`}
function minibars(rows,max){max=max||Math.max(1,...rows.map(r=>r.v));return `<div class="mbars">${rows.map(r=>`<div class="mb"><span class="mb-l">${esc(r.l)}</span><span class="mb-t"><i style="width:${Math.max(r.v?6:0,100*r.v/max)}%;background:${r.c}"></i></span><b class="num">${r.txt??r.v}</b></div>`).join('')}</div>`}
function ring(p,color,val,label){p=Math.max(0,Math.min(1,p||0));const r=26,c=+(2*Math.PI*r).toFixed(1);
  return `<div class="ring"><div class="ring-g"><svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="${r}" fill="none" stroke="var(--track)" stroke-width="7"/><circle class="ring-v" cx="32" cy="32" r="${r}" fill="none" stroke="${color}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${(c*(1-p)).toFixed(1)}" transform="rotate(-90 32 32)" style="--c:${c}"/></svg><b>${val}</b></div><small>${label}</small></div>`}
const stat=(v,l,cls='')=>`<div class="st"><span class="big ${cls}">${v}</span><small>${l}</small></div>`;

function fioCurva(x1,y1,x2,y2){const dx=Math.max(40,Math.abs(x2-x1)*.45);const s=x2>=x1?1:-1;

function autoScroll(x,y){const sc=document.elementFromPoint(x,y);const box=sc&&sc.closest('.board,.ag-week');if(box&&box.scrollWidth>box.clientWidth){const r=box.getBoundingClientRect();if(x<r.left+60)box.scrollLeft-=14;else if(x>r.right-60)box.scrollLeft+=14}

function startDrag(e,src){const x0=e.clientX,y0=e.clientY,origin=src.closest('[data-drop]');let ghost=null,over=null,moved=false,raf=0,lx=x0,ly=y0;
  const move=ev=>{lx=ev.clientX;ly=ev.clientY;
    if(!moved){if(Math.hypot(lx-x0,ly-y0)<7)return;moved=true;DRAG.on=true;const r=src.getBoundingClientRect();
      ghost=src.cloneNode(true);ghost.classList.add('drag-ghost');ghost.style.width=r.width+'px';ghost.dataset.dx=x0-r.left;ghost.dataset.dy=y0-r.top;document.body.appendChild(ghost);src.classList.add('dragging');document.body.classList.add('is-dragging');

    const z=dropZoneAt(lx,ly);if(z!==over){over&&over.classList.remove('drop-over');over=z;z&&z!==origin&&z.classList.add('drop-over')}

  const move=ev=>{if(done)return;const dx=ev.clientX-x0;if(Math.abs(dx)>20)wk.style.transform=`translateX(${dx*.35}px)`;if(Math.abs(dx)>140){done=true;finish(dx<0?7:-7)}};
  const finish=d=>{cleanup();DRAG.justEnded=Date.now();ui.semana=addDays(ui.semana||monday(today()),d);toast(d>0?'Próxima semana':'Semana anterior');render()};
  const cleanup=()=>{wk.style.transform='';removeEventListener('pointermove',move);removeEventListener('pointerup',cleanup)};
  addEventListener('pointermove',move);addEventListener('pointerup',cleanup)}
async function doDrop(src,target){const[kind,val]=target.split(':');try{SOM.play(kind==='lixo'?'lixo':'abre')}catch(e){}const id=src.dataset.id;
  if(src.dataset.drag==='livro'&&kind==='livro'){const L=S.estudos.livros;const b=byId(L,id);if(!b||b.status===val)return;b.status=val;
    if(val==='lendo'&&!b.inicio)b.inicio=today();
    if(val==='lido'){if(!b.fim)b.fim=today();if(b.total)b.pag=b.total;}
    if(val!=='lido'&&b.fim&&b.fim<=today()&&val==='lendo'&&b.pag>=b.total)b.fim='';
    commit('estudos');toast('"'+b.titulo+'" em '+({lendo:'Lendo agora',quero:'Fila',lido:'Concluídos'})[val]);return}
  if(src.dataset.drag==='dem'&&kind==='lixo'){const i=S.dem.items.findIndex(x=>x.id===id);if(i<0)return;const [d]=S.dem.items.splice(i,1);commit('dem');

  if(src.dataset.drag==='dem'&&kind==='dem'){const d=byId(S.dem.items,id);if(!d)return;d.status=val;if(val==='feito')d.concluido=today();commit('dem');toast('Movido para '+DSTAT.find(s=>s[0]===val)[1])}
  else if(src.dataset.drag==='post'&&kind==='post'){const p=byId(S.cont.posts,id);if(!p)return;p.status=val;if(val==='postado'&&!p.data)p.data=today();commit('cont');toast('Movido para '+PSTAT.find(s=>s[0]===val)[1])}
  else if(src.dataset.drag==='prazo'&&kind==='dia'){const k=src.dataset.k;const L=k==='dem'?S.dem.items:k==='fac'?S.estudos.fac:S.cont.posts;const it=byId(L,id);if(!it)return;
    if(k==='post')it.data=val;else it.prazo=val;commit(k==='dem'?'dem':k==='fac'?'estudos':'cont');toast('Prazo movido para '+fmtDL(val));
    if(it.gEvent){try{await gCall(GCAL,'update_event',{eventId:it.gEvent,allDay:true,startTime:val+'T00:00:00',endTime:addDays(val,1)+'T00:00:00'});render()}catch(e){toast('Prazo movido no QG; no Google Agenda não: '+gMsg(e,'a agenda'))}}}
  else if(src.dataset.drag==='ev'&&kind==='dia'){const ev=evList(G.cal).find(x=>x.id===id);if(!ev)return;
    const days=Math.round((new Date(val+'T12:00')-new Date(ev.dia+'T12:00'))/864e5);if(!days)return;
    const ni=new Date(ev.ini),nf_=new Date(ev.fim);ni.setDate(ni.getDate()+days);nf_.setDate(nf_.getDate()+days);
    const inp=ev.all?{eventId:id,allDay:true,startTime:isoOf(ni)+'T00:00:00',endTime:isoOf(nf_)+'T00:00:00'}:{eventId:id,startTime:localISO(ni),endTime:localISO(nf_)};
    const prev=G.cal.data;G.cal.data=Object.assign({},prev,{events:(prev.events||[]).map(x=>x.id!==id?x:Object.assign({},x,{start:ev.all?{date:isoOf(ni)}:{dateTime:ni.toISOString()},end:ev.all?{date:isoOf(nf_)}:{dateTime:nf_.toISOString()}}))});render();
    toast('Movendo "'+ev.titulo+'"…');
    try{await gCall(GCAL,'update_event',inp);toast('Evento movido para '+fmtDL(val));render()}
    catch(e){G.cal.data=prev;render();toast('Não deu para mover: '+gMsg(e,'a agenda'))}}
}

    const target=parseBR(m[0]);if(!isFinite(target)||target===0)return;const dec=(m[0].split(',')[1]||'').length;const pre=txt.slice(0,m.index),pos=txt.slice(m.index+m[0].length);

  const draw={
    inicio(t){for(let i=0;i<3;i++){const x=W*(.25+.3*i)+Math.sin(t/5200+i*2)*W*.12,y=H*(.35+.25*Math.sin(t/6400+i*1.7)),r=Math.min(W,H)*(.32+.06*i);

      ctx.strokeRect(x,p.y,p.s*1.4,p.s);ctx.beginPath();ctx.moveTo(x,p.y);ctx.lineTo(x+p.s*.7,p.y+p.s*.55);ctx.lineTo(x+p.s*1.4,p.y);ctx.stroke()})},

      for(let i=0;i<n;i+=2){const v=P[(i+shift)%n],v2=P[(i+1+shift)%n];const x=i*step-off;A_(v2<v?C.ok:C.fg,C.dark?.09:.06);ctx.fillRect(x-3,H-60-Math.abs(v-v2)*1.6,6,Math.abs(v-v2)*1.6+8)}},
    demandas(t){ctx.lineWidth=1;A_(C.fg,C.dark?.05:.04);const o=(t/40)%60;for(let x=-H;x<W+H;x+=60){ctx.beginPath();ctx.moveTo(x+o,0);ctx.lineTo(x+o+H,H);ctx.stroke()}
      P.forEach((p,i)=>{p.x+=p.v;if(p.x>W+20)p.x=-p.w-20;A_(i%3?C.fg:C.acc,C.dark?.08:.07);ctx.beginPath();ctx.roundRect?ctx.roundRect(p.x,p.y,p.w,46,10):ctx.rect(p.x,p.y,p.w,46);ctx.fill()})},

      for(let x=-per;x<W+per;x+=3){const k=((x+off)%per+per)%per;let y=y0;if(k>110&&k<120)y-=(k-110)*3;else if(k>=120&&k<132)y=y0-30+(k-120)*7;else if(k>=132&&k<142)y=y0+54-(k-132)*5.4;else if(k>160&&k<190)y-=Math.sin((k-160)/30*Math.PI)*10;x===-per?ctx.moveTo(x,y):ctx.lineTo(x,y)}ctx.stroke()},

const SOM=(()=>{let ctx=null,out=null,noise=null,last=0,on=true;try{on=localStorage.getItem('qg:sons')!=='0'}catch(e){}
