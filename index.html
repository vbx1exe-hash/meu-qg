  slot.loading=false;slot.err={code:'no_mcp'}}
async function gCall(server,tool,input){if(server!==GCAL)throw {code:'no_mcp'};
  const A=S.agenda=Object.assign({eventos:[]},S.agenda||{});const L=A.eventos=[...A.eventos];
  const quando=(t,all)=>all?{date:String(t).slice(0,10)}:{dateTime:String(t).slice(0,19)};
  if(tool==='create_event'){const ev={id:uid(),summary:input.summary||'(sem título)',location:input.location||'',description:input.description||'',start:quando(input.startTime,input.allDay),end:quando(input.endTime||input.startTime,input.allDay)};L.push(ev);commit('agenda');return ev}
  const i=L.findIndex(e=>e.id===input.eventId);if(i<0)throw {code:'tool_error',message:'Evento não encontrado'};
  if(tool==='delete_event'){L.splice(i,1);commit('agenda');return {}}
  if(tool==='update_event'){const e=Object.assign({},L[i]);['summary','location','description'].forEach(k=>{if(k in input)e[k]=input[k]});
    if(input.startTime){const all=input.allDay===true||(input.allDay===undefined&&!!e.start.date);e.start=quando(input.startTime,all);e.end=quando(input.endTime||input.startTime,all)}
    L[i]=e;commit('agenda');return e}
  throw {code:'tool_error',message:'Ação não suportada'}}

/* ---------- backup ---------- */
function baixarBackup(){const dados={app:'meu-qg',versao:1,criado:new Date().toISOString(),perfil:PERFIL,dados:S};
  const b=new Blob([JSON.stringify(dados)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='meu-qg-backup-'+today()+'.json';
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},800);toast('Backup baixado')}
function restaurarBackup(f){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);const D=d&&(d.dados||d.S);if(!D)throw 0;
    KEYS.forEach(k=>{if(D[k])lsSet(k,D[k])});if(D.lanc)lsSet('lanc',D.lanc);if(d.perfil)localStorage.setItem('qg:perfil',JSON.stringify(d.perfil));
    toast('Backup restaurado');setTimeout(()=>location.reload(),700)}catch(e){toast('Esse arquivo não é um backup do QG')}};r.readAsText(f)}
function apagarTudo(){try{Object.keys(localStorage).filter(k=>k.startsWith('qg:')).forEach(k=>localStorage.removeItem(k));sessionStorage.clear()}catch(e){}location.reload()}

/* ---------- boas-vindas e configurações ---------- */
function abrirConfig(primeira){const p=Object.assign({},PERFIL);const E=S.config.empresas.map(e=>Object.assign({},e));
  let ov=document.getElementById('cfg');if(!ov){ov=document.createElement('div');ov.id='cfg';document.body.appendChild(ov)}
  const sw=CORES.map(([n,c])=>`<button type="button" class="cor-sw ${String(p.cor).toLowerCase()===c?'on':''}" style="--c:${c}" data-cor="${c}" aria-label="${n}" title="${n}"></button>`).join('');
  ov.innerHTML=`<form class="cfg-box" id="cfgForm" autocomplete="off">
    <div class="cfg-hd"><div><div class="eyebrow">${primeira?'Bem-vindo // vamos montar o seu QG':'Configurações // perfil, cores e dados'}</div>
      <h2 class="h1 cfg-h">${primeira?'Seu QG, <span class="tag">do seu jeito.</span>':'Personalize <span class="tag">o seu QG.</span>'}</h2>
      ${primeira?'<p class="sub" style="margin:8px 0 0">Leva um minuto. Dá para mudar tudo depois em Configurações.</p>':''}</div>
      ${primeira?'':'<button type="button" class="icon-btn" id="cfgX" aria-label="Fechar">✕</button>'}</div>
    <div class="cfg-grid">
      <div class="f"><label for="cNome">Seu nome</label><input class="inp" id="cNome" required value="${esc(p.nome)}" placeholder="Ex.: Vitória"></div>
      <div class="f"><label for="cMarca">Nome no logo</label><input class="inp" id="cMarca" value="${esc(p.marca==='meuqg'&&!p.nome?'':p.marca)}" placeholder="Ex.: vitoria"></div>
      <div class="f full"><label for="cSlogan">Frase de efeito (aparece no logo e na abertura)</label><input class="inp" id="cSlogan" value="${esc(p.slogan)}"></div>
      <div class="f full"><label for="cBio">Uma linha sobre você (aparece no Início)</label><input class="inp" id="cBio" value="${esc(p.bio)}" placeholder="Ex.: Designer e fundadora do Estúdio X"></div>
      <div class="f full"><label>Cor principal</label><div class="cor-row">${sw}<label class="cor-custom" title="Escolher outra cor"><input type="color" id="cCor" value="${esc(p.cor)}" aria-label="Outra cor"><span>Outra</span></label></div></div>
      <div class="f"><label>Tema</label><div class="filters"><button type="button" data-tema="claro" aria-pressed="${p.tema!=='escuro'}">☀ Claro</button><button type="button" data-tema="escuro" aria-pressed="${p.tema==='escuro'}">☾ Escuro</button></div></div>
      <div class="f"><label for="cInsta">Seu Instagram (sem @, opcional)</label><input class="inp" id="cInsta" value="${esc(p.instagram)}" placeholder="seu.perfil"></div>
      <div class="f full"><label>Suas empresas e áreas (aparecem em Demandas e na Rotina)</label><div class="emp-grid">${E.map((e,i)=>`<div class="emp-it"><input type="color" class="emp-cor" data-i="${i}" value="${esc(e.cor)}" aria-label="Cor"><input class="inp emp-n" data-i="${i}" value="${esc(e.nome)}" aria-label="Nome da área ${i+1}"></div>`).join('')}</div></div>
      <div class="f full"><label for="cPil">Pilares de conteúdo (separados por vírgula)</label><input class="inp" id="cPil" value="${esc(p.pilares.join(', '))}"></div>
    </div>
    ${primeira?'':`<div class="cfg-dados"><div><b>Seus dados</b><div class="small muted">Ficam salvos neste aparelho. Faça um backup de vez em quando e use para passar para outro aparelho.</div></div>
      <div class="hstack"><button type="button" class="btn sm" id="cBak">Baixar backup</button><label class="btn sm" style="cursor:pointer">Restaurar backup<input type="file" id="cRes" accept=".json,application/json" hidden></label><button type="button" class="btn sm ghost danger" id="cDel">Apagar tudo</button></div></div>`}
    <div class="cfg-ft"><button class="btn pri" type="submit">${primeira?'Começar a usar':'Salvar'}</button></div></form>`;
  ov.hidden=false;document.body.classList.add('cfg-aberto');
  const setCor=c=>{p.cor=c;aplicarCor(c);ov.querySelectorAll('.cor-sw').forEach(b=>b.classList.toggle('on',b.dataset.cor.toLowerCase()===c.toLowerCase()));const ci=ov.querySelector('#cCor');if(ci&&ci.value.toLowerCase()!==c.toLowerCase())ci.value=c};
  ov.querySelectorAll('.cor-sw').forEach(b=>b.onclick=()=>setCor(b.dataset.cor));ov.querySelector('#cCor').oninput=e=>setCor(e.target.value);
  const tema=t=>{if(t==='escuro')document.documentElement.dataset.skin='escuro';else delete document.documentElement.dataset.skin;try{FX.colors()}catch(e){}};
  ov.querySelectorAll('[data-tema]').forEach(b=>b.onclick=()=>{p.tema=b.dataset.tema;ov.querySelectorAll('[data-tema]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));tema(p.tema)});
  const fechar=()=>{ov.hidden=true;document.body.classList.remove('cfg-aberto');aplicarCor(PERFIL.cor);tema(skin()==='escuro'?'escuro':'claro')};
  const x=ov.querySelector('#cfgX');if(x)x.onclick=fechar;
  if(!primeira){ov.querySelector('#cBak').onclick=baixarBackup;ov.querySelector('#cRes').onchange=e=>{const f=e.target.files[0];if(f)restaurarBackup(f)};
    const del=ov.querySelector('#cDel');del.onclick=()=>{if(!del.dataset.armed){del.dataset.armed=1;del.textContent='Confirmar: apagar tudo deste aparelho?';return}apagarTudo()}}
  ov.querySelector('#cfgForm').onsubmit=e=>{e.preventDefault();const nome=ov.querySelector('#cNome').value.trim();if(!nome){ov.querySelector('#cNome').focus();return}
    const marca=(ov.querySelector('#cMarca').value.trim()||nome.split(' ')[0]).toLowerCase().replace(/\s+/g,'');
    const novo=Object.assign({},PERFIL,{nome,marca,slogan:ov.querySelector('#cSlogan').value.trim(),bio:ov.querySelector('#cBio').value.trim(),instagram:ov.querySelector('#cInsta').value.trim().replace(/^@/,''),cor:p.cor,tema:p.tema,
      pilares:ov.querySelector('#cPil').value.split(',').map(s=>s.trim()).filter(Boolean).slice(0,8)});
    if(!novo.pilares.length)novo.pilares=PERFIL_PADRAO.pilares.slice();
    E.forEach((em,i)=>{const n=ov.querySelector('.emp-n[data-i="'+i+'"]').value.trim();em.cor=ov.querySelector('.emp-cor[data-i="'+i+'"]').value;if(n)em.nome=n});
    S.config.empresas=E;S.cont.handle=novo.instagram;commit('config');commit('cont');
    try{localStorage.setItem('qg:perfil',JSON.stringify(novo));localStorage.setItem('qg:skin',novo.tema);if(primeira)sessionStorage.removeItem('qg:splash');else sessionStorage.setItem('qg:splash','1')}catch(e){}
    toast(primeira?'Pronto! Montando o seu QG…':'Salvo');setTimeout(()=>location.reload(),450)};
  setTimeout(()=>{const n=ov.querySelector('#cNome');n&&n.focus()},60)}
A.config=()=>abrirConfig(false);
A.backup=baixarBackup;

initStore();
aplicarCor(PERFIL.cor);
if(!PERFIL_OK())setTimeout(()=>abrirConfig(true),80);
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
